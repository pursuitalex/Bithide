<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#2F63D2">
<title>BitHide — Sign in</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F9FC; --cream:#EEF3FA; --line:#E1E7F0;
  --ink:#1D2433; --ink-2:#5F6878; --ink-3:#9AA3B3;
  --acc:#2F63D2; --acc-soft:#4F86F0; --tint:#E6EEFC; --neg:#e5484d;
  --ease:cubic-bezier(.22,.7,.2,1); --spring:cubic-bezier(.34,1.45,.64,1);
  --font:Manrope,system-ui,sans-serif;
  --r-field:16px; /* inputs: large corners, not a pill (pills are for buttons) */
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{min-height:100vh;min-height:100dvh;font-family:var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:32px 16px;overflow-x:clip}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
svg{display:block}

/* brand backdrop: soft haze + glass logo from the site */
.bg{position:fixed;inset:0;z-index:-1;background:url(assets/final-dream-4.webp) 70% 50%/cover no-repeat}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 70% at 50% 50%,rgba(247,249,252,.55),rgba(247,249,252,.1) 70%)}

.wrap{width:min(440px,100%);display:flex;flex-direction:column;align-items:center;animation:rise .8s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
.logo{display:flex;align-items:center;gap:12px;height:56px;padding:0 20px 0 16px;border-radius:40px;background:#fff;box-shadow:0 6px 30px -12px rgba(29,36,51,.18)}
.logo img{height:26px;width:auto}
.logo span{height:26px;padding:0 10px;border-radius:30px;background:var(--tint);color:var(--acc);font:700 12px/26px var(--font);letter-spacing:.02em}

.card{width:100%;margin-top:18px;padding:36px 32px 32px;border-radius:32px;background:rgba(255,255,255,.82);backdrop-filter:blur(24px) saturate(1.2);-webkit-backdrop-filter:blur(24px) saturate(1.2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.9),0 40px 80px -40px rgba(18,40,90,.45)}
.card h1{font:600 34px/1.1 var(--font);letter-spacing:-.045em;text-align:center}
.card>p{margin-top:8px;text-align:center;font:500 15px/1.45 var(--font);color:var(--ink-2)}
form{display:grid;gap:18px;margin-top:28px}
.field{display:flex;flex-direction:column;gap:8px}
.field>span{font:600 12px/1 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.box{position:relative}
.inp{width:100%;height:52px;padding:0 20px;border:0;border-radius:var(--r-field);background:#fff;box-shadow:inset 0 0 0 1px var(--line);font:600 15px/1 var(--font);color:var(--ink);outline:0;transition:box-shadow .2s}
.inp::placeholder{color:var(--ink-3);font-weight:500}
.inp:focus{box-shadow:inset 0 0 0 2px var(--acc-soft)}
.field.err .inp{box-shadow:inset 0 0 0 2px var(--neg)}
.field .msg{font:600 12.5px/1.3 var(--font);color:var(--neg)}
.box .inp{padding-right:54px}
.eye{position:absolute;right:6px;top:6px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);transition:background .2s,color .2s}
.eye:hover{background:var(--cream);color:var(--acc)}
.eye svg{width:18px;height:18px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;font:600 13px/1 var(--font)}
.chk{display:flex;align-items:center;gap:8px;color:var(--ink-2);cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--acc)}
.row a{color:var(--acc)}
.row a:hover{text-decoration:underline}
.btn{display:flex;align-items:center;justify-content:space-between;gap:12px;height:56px;margin-top:4px;padding:0 8px 0 26px;border-radius:40px;background:var(--acc);color:#fff;font:600 16px/1 var(--font);letter-spacing:-.02em;transition:background .25s}
.btn:hover{background:#2552b5}
.btn .ar{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--acc);display:grid;place-items:center;transition:transform .4s var(--spring)}
.btn:hover .ar{transform:translateX(3px)}
.btn .ar svg{width:16px;height:16px}
.btn.load .ar svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.alt{margin-top:22px;font:500 14px/1.4 var(--font);color:var(--ink-2);text-align:center}
.alt a{margin-left:4px;font-weight:700;color:var(--acc)}
.alt a:hover{text-decoration:underline}
.foot{margin-top:18px;display:flex;align-items:center;gap:8px;font:600 12.5px/1 var(--font);color:var(--ink-2)}
.foot svg{width:15px;height:15px;color:var(--acc)}
@media (max-width:480px){.card{padding:28px 20px 24px;border-radius:26px}.card h1{font-size:28px}.bg{background-position:80% 50%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<svg width="0" height="0" style="position:absolute">
  <symbol id="eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
  <symbol id="eye-off" viewBox="0 0 24 24"><path d="M4 4l16 16M10.6 6.1A9.5 9.5 0 0 1 12 6c6 0 9.5 6 9.5 6a16 16 0 0 1-3 3.6M6.5 7.6C4 9.4 2.5 12 2.5 12S6 18.5 12 18.5c1.6 0 3-.4 4.2-1M10 10a3 3 0 0 0 4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="arr" viewBox="0 0 16 16"><path d="M3 8h10m-4-4 4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="spin" viewBox="0 0 16 16"><path d="M8 2a6 6 0 1 1-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
</svg>

<main class="wrap">
  <a class="logo" href="index.html" aria-label="BitHide"><img src="assets/logo-filled.svg" alt="BitHide"><span>BackOffice</span></a>
  <section class="card">
    <h1>Sign in</h1>
    <p>Enter your account details.</p>
    <form id="f" novalidate>
      <label class="field" id="fe"><span>Email</span><input class="inp" id="email" type="email" autocomplete="username" placeholder="name@example.com"><em class="msg" hidden>Enter a valid email address</em></label>
      <label class="field" id="fp"><span>Password</span><div class="box"><input class="inp" id="pw" type="password" autocomplete="current-password" placeholder="Your password"><button class="eye" type="button" id="eyeBtn" aria-label="Show password"><svg><use href="#eye"/></svg></button></div><em class="msg" hidden>Enter your password</em></label>
      <div class="row"><label class="chk"><input type="checkbox" checked>Keep me signed in</label><a href="#">Forgot password?</a></div>
      <button class="btn" type="submit" id="go">Sign in<span class="ar"><svg><use href="#arr"/></svg></span></button>
    </form>
    <p class="alt">No account yet?<a href="#">Create account</a></p>
  </section>
  <p class="foot"><svg><use href="#lock"/></svg>Runs on your infrastructure · Non-custodial</p>
</main>

<script>
// demo only: nothing is sent anywhere, the form just opens the dashboard
const f=document.getElementById('f'),email=document.getElementById('email'),pw=document.getElementById('pw'),eye=document.getElementById('eyeBtn'),go=document.getElementById('go');
eye.addEventListener('click',()=>{const show=pw.type==='password';pw.type=show?'text':'password';eye.setAttribute('aria-label',show?'Hide password':'Show password');eye.querySelector('use').setAttribute('href',show?'#eye-off':'#eye')});
const mark=(el,bad)=>{el.classList.toggle('err',bad);el.querySelector('.msg').hidden=!bad};
[email,pw].forEach(i=>i.addEventListener('input',()=>mark(i.closest('.field'),false)));
f.addEventListener('submit',e=>{e.preventDefault();
  const badE=!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim()),badP=!pw.value;
  mark(document.getElementById('fe'),badE);mark(document.getElementById('fp'),badP);
  if(badE)return email.focus();if(badP)return pw.focus();
  go.classList.add('load');go.querySelector('use').setAttribute('href','#spin');
  setTimeout(()=>location.href='dashboard.html#mobile',700);
});
</script>
</body>
</html>
